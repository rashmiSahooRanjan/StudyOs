# ==========================================
# Render Blueprint Configuration (render.yaml)
# StudyOS Full Stack Deployment
# ==========================================
services:
  - type: web
    name: studyos
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/data/studyos.db
    disk:
      name: studyos-data
      mountPath: /app/data
      sizeGB: 1
