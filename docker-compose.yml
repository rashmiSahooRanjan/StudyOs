# ==========================================
# StudyOS Docker Compose Production Stack
# React (Nginx) + Flask (Gunicorn) + Persistent SQLite
# ==========================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studyos-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/studyos.db}
      - SECRET_KEY=${SECRET_KEY:-studyos-prod-super-secret-key-2026-secure}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-studyos-prod-jwt-secret-key-2026-ultra-secure}
    volumes:
      - studyos-data:/app/data
    networks:
      - studyos-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studyos-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - studyos-network

volumes:
  studyos-data:
    name: studyos-persistent-data

networks:
  studyos-network:
    name: studyos-internal-network
    driver: bridge
